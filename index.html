// Send an authenticated HTTP request to the C++ backend and parse its JSON response.
async function requestApi(path, options={}){
  const headers={'Content-Type':'application/json',...(sessionToken?{Authorization:'Bearer '+sessionToken}:{})};
  const response=await fetch(path,{...options,headers:{...headers,...(options.headers||{})}});
  const result=await response.json();
  if(!response.ok)throw new Error(result.message||('HTTP '+response.status));
  return result;
}
// Reload shared data from /api/state and refresh the visible page.
async function refreshData(){
  if(!sessionToken)return;

}

}

}

// Read a selected file into base64 for uploading; check extension and size first.
async function selectedAttachment(inputId){
  const file=document.getElementById(inputId)?.files?.[0];
  if(!file)return null;
  if(file.size>4*1024*1024)throw new Error(tr('fileTooBig'));
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(!ALLOWED_FILE_EXT.includes(ext))throw new Error(tr('fileUnsupported'));
  const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=()=>reject(new Error('File read failed'));r.readAsDataURL(file)});

}

function assignmentsView(){const items=data.tasks.filter(t=>(filterCourse==='all'||String(t.course)===filterCourse)&&accessibleCourses().some(c=>c.id===t.course));return `<div class="toolbar">${courseSelect(filterCourse)}${role==='teacher'?btn('+ '+tr('newAssignment'),"editingTask=!editingTask;render()",'sm'):''}</div><div class="grid">${role==='teacher'&&editingTask?card(`${heading('createAssignment')}<div class="split"><div><label class="field">${tr('selectCourse')}</label><select id="new-task-course">${teacherCourses().map(c=>`<option value="${c.id}" ${filterCourse===String(c.id)?'selected':''}>${esc(nameCourse(c))}</option>`).join('')}</select></div><div><label class="field">${tr('dueDate')}</label><input id="new-task-due" type="date" value="2026-11-30"></div></div><label class="field">${tr('assignmentTitle')}</label><input id="new-task-title"><label class="field">${tr('instructions')}</label><textarea id="new-task-desc"></textarea>${fileInput('new-task-file')}<p class="actions">${btn(tr('publish'),'publishTask()','sm')}${btn(tr('cancel'),"editingTask=false;render()")}</p>`):''}${submitId!=null?submitForm():''}${items.length?items.map(t=>{const sub=data.submissions.find(s=>s.task===t.id&&s.student==='Laurynas K.');return card(`<div class="line" style="border:0;padding:0"><div class="line-content"><span class="tag">${esc(getCourse(t.course).code)}</span> <h2 style="margin:10px 0 5px;color:var(--text)">${esc(taskTitle(t))}</h2><div class="muted small">${tr('dueDate')}: ${dateFmt(t.due)}</div></div>${role==='student'?`<span class="tag ${sub?.grade!=null?'good':'gray'}">${taskStatus(t)}</span>`:''}</div><p class="muted" style="margin-top:12px">${esc(t.desc)}</p>${t.file?`<p>${attachmentLink(t.file)}</p>`:''}<div class="actions">${role==='student'?btn(sub?tr('yourSubmission'):tr('submit'),`openSubmit(${t.id})`,'sm'):btn(tr('submissions'),`reviewTaskSubmissions(${t.id})`)}${role==='teacher'?btn(tr('remove'),`removeTask(${t.id})`):''}</div>`,'s6')}).join(''):card(`<div class="empty">${tr('noAssignments')}</div>`)}</div>`}
// Open the student submission form for an assignment.
function openSubmit(id){submitId=id;render();setTimeout(()=>$('#answer')?.focus(),20)}
// Render the student answer field and optional attachment picker.
function submitForm(){const t=getTask(submitId);if(!t)return '';const existing=data.submissions.find(s=>s.task===t.id&&s.student==='Laurynas K.');return card(`${heading('submitWork')}<p><b>${esc(taskTitle(t))}</b></p><label class="field">${tr('submissionText')}</label><textarea id="answer" placeholder="${tr('enterAnswer')}" >${esc(existing?.text||'')}</textarea>${existing?.file?`<p>${attachmentLink(existing.file)}</p><p class="hint">${tr('keepFile')}</p>`:''}${fileInput('submission-file')}<p class="actions">${btn(tr('submitWork'),`saveSubmission(${t.id})`,'sm')}${btn(tr('cancel'),"submitId=null;render()")}</p>`)}
// Submit student text/file to the backend; grading happens later.
async function saveSubmission(id){
  const value=$('#answer')?.value.trim();let file;try{file=await selectedAttachment('submission-file')}catch(e){return toast(e.message)}
  const existing=data.submissions.find(s=>s.task===id&&s.student==='Laurynas K.');
  if(!value&&!file&&!existing?.file)return toast(tr('fileOrText'));
  if(await sendAction('submit',{task:id,text:value,...(file?{file}:{})})){submitId=null;toast(tr('workSubmitted'));render()}
}
// Create a teacher assignment with optional file attachment.
async function publishTask(){
  const title=$('#new-task-title').value.trim(),due=$('#new-task-due').value;
  if(!title||!due)return toast(tr('needTitle'));
  let file;try{file=await selectedAttachment('new-task-file')}catch(e){return toast(e.message)}
  if(await sendService('/api/assignments',{course:+$('#new-task-course').value,title,due,desc:$('#new-task-desc').value.trim(),...(file?{file}:{})})){
    editingTask=false;toast(tr('taskPublished'));render()
  }
}
// Delete an assignment after teacher confirmation.
async function removeTask(id){if(!confirm(tr('confirmRemove')))return;await sendAction('removeTask',{id})}
// Open a prefilled editor for an existing learning material (teacher only).
function editMaterial(id){
  if(role!=='teacher')return;
  const m=data.materials.find(x=>x.id===id);
  if(!m)return;
  editingMaterial=true;editingMaterialId=id;render();
  document.getElementById('new-mat-title').value=m.title;
  document.getElementById('new-mat-desc').value=m.desc||'';
  document.getElementById('new-mat-course').value=String(m.course);
  document.getElementById('new-mat-title').focus();
}
// Show materials, optional attachments, and the add/edit form for teachers.
function materialsView(){
  const items=data.materials.filter(m=>(filterCourse==='all'||String(m.course)===filterCourse)&&accessibleCourses().some(c=>c.id===m.course));
  const existing=editingMaterialId!=null?data.materials.find(m=>m.id===editingMaterialId):null;
  const form=role==='teacher'&&editingMaterial?card(`
    ${heading(existing?'editMaterial':'newMaterial')}
    <label class="field" for="new-mat-course">${tr('selectCourse')}</label>
    <select id="new-mat-course">${teacherCourses().map(c=>`<option value="${c.id}" ${String(existing?.course??filterCourse)===String(c.id)?'selected':''}>${esc(nameCourse(c))}</option>`).join('')}</select>
    <label class="field" for="new-mat-title">${tr('materialTitle')}</label>
    <input id="new-mat-title" value="${esc(existing?.title||'')}">
    <label class="field" for="new-mat-desc">${tr('materialDescription')}</label>
    <textarea id="new-mat-desc">${esc(existing?.desc||'')}</textarea>
    ${existing?.file?`<p>${attachmentLink(existing.file)}</p><p class="hint">${tr('keepFile')}</p><label class="field"><input id="mat-remove-file" type="checkbox"> ${tr('removeAttachedFile')}</label>`:''}
    ${fileInput('new-mat-file')}
    <p class="hint">${tr('materialFileHelp')}</p>
    <p class="actions">${btn(existing?tr('saveMaterial'):tr('addMaterial'),'saveMaterial()','sm')}${btn(tr('cancel'),"editingMaterial=false;editingMaterialId=null;render()")}</p>
  `,'s12'):'';
  const cards=items.length?items.map(m=>card(`
    <span class="tag">${esc(getCourse(m.course).code)}</span>
    <h2 style="color:var(--text);margin:10px 0">${esc(m.title)}</h2>
    <p class="muted">${esc(m.desc)}</p>
    ${m.file?`<p>${attachmentLink(m.file)}</p>`:''}
    ${role==='teacher'?`<div class="actions">${btn(tr('editMaterial'),`editMaterial(${m.id})`,'sm')}${btn(tr('remove'),`removeMaterial(${m.id})`)}</div>`:''}
  `,'s6')).join(''):card(`<div class="empty">${tr('noMaterials')}</div>`);
  return `<div class="toolbar">${courseSelect(filterCourse)}${role==='teacher'?btn('+ '+tr('newMaterial'),"editingMaterial=true;editingMaterialId=null;render()",'sm'):''}</div><div class="grid">${form}${cards}</div>`;
}
// Create or update learning materials and optionally upload/replace a file.
async function saveMaterial(){
  const title=$('#new-mat-title')?.value.trim(),desc=$('#new-mat-desc')?.value.trim()||'';
  if(!title)return toast(tr('materialTitle'));
  let file;try{file=await selectedAttachment('new-mat-file')}catch(e){return toast(e.message)}
  const existingId=editingMaterialId;
  const payload={course:+$('#new-mat-course').value,title,desc,...(file?{file}:{})};
  if(existingId!=null){
    payload.id=existingId;
    payload.removeFile=!file&&!!$('#mat-remove-file')?.checked;
  }
  if(await sendAction(existingId!=null?'updateMaterial':'addMaterial',payload)){
    editingMaterial=false;editingMaterialId=null;
    toast(tr(existingId!=null?'materialUpdated':'materialAdded'));render();
  }
}
// Preserve the old addMaterial() entry point for any existing UI integrations.
async function addMaterial(){return saveMaterial()}
// Delete a learning material after teacher confirmation.
async function removeMaterial(id){if(!confirm(tr('confirmRemove')))return;await sendAction('removeMaterial',{id})}
// Show student submissions and allow the teacher to open a review.
function submissionsView(){
  const scoped=data.submissions.filter(s=>{const t=getTask(s.task);return t&&teacherCourses().some(c=>c.id===t.course)&&
    (filterCourse==='all'||String(t.course)===filterCourse)});
  const items=scoped.filter(s=>filterTask==='all'||String(s.task)===filterTask);
  const taskOptions=data.tasks.filter(t=>teacherCourses().some(c=>c.id===t.course)&&
    (filterCourse==='all'||String(t.course)===filterCourse));
  return `<div class="toolbar">${courseSelect(filterCourse)}<select aria-label="${tr('assignments')}" onchange="setSubmissionTask(this.value)"><option value="all">${tr('allAssignments')}</option>${taskOptions.map(t=>`<option value="${t.id}" ${filterTask===String(t.id)?'selected':''}>${esc(taskTitle(t))}</option>`).join('')}</select></div>
  <div class="grid">${reviewId!=null?reviewForm():''}${card(`${heading('submissions')}<div class="table-wrap"><table><thead><tr><th>${tr('student')}</th><th>${tr('assignments')}</th><th>${tr('date')}</th><th>${tr('grade')}</th><th></th></tr></thead><tbody>${items.map(s=>`<tr><td>${esc(s.student)}</td><td>${esc(taskTitle(getTask(s.task)))}</td><td>${dateFmt(s.date)}</td><td>${s.grade??'—'}</td><td>${btn(tr('review'),`reviewId=${s.id};render()`,'sm')}</td></tr>`).join('')}</tbody></table></div>${items.length?'':`<div class="empty">${tr('noSubmissions')}</div>`}`)}</div>`
}

// Render the teacher grading form and any student attachment.
function reviewForm(){const s=data.submissions.find(x=>x.id===reviewId);if(!s)return '';return card(`${heading('codeReview')}<p><b>${esc(s.student)}</b> · ${esc(taskTitle(getTask(s.task)))}</p><pre class="console" style="white-space:pre-wrap">${esc(s.text||'—')}</pre>${s.file?`<p>${attachmentLink(s.file)}</p>`:''}<label class="field">${tr('gradeRange')}</label><input type="number" id="review-grade" min="1" max="10" value="${s.grade??''}"><label class="field">${tr('feedback')}</label><textarea id="review-feedback">${esc(s.feedback)}</textarea><p class="actions">${btn(tr('saveGrade'),`saveGrade(${s.id})`,'sm')}${btn(tr('cancel'),"reviewId=null;render()")}</p>`)}
// Send grade and feedback to the C++ Grading Service.
async function saveGrade(id){
  const v=Number($('#review-grade').value);if(!Number.isInteger(v)||v<1||v>10)return toast(tr('invalidGrade'));
  if(await sendService('/api/grades',{id,grade:v,feedback:$('#review-feedback').value})){
    reviewId=null;toast(tr('gradePublished'));render()
  }
}
// Show published grades and feedback for teacher or student.
function gradingView(){if(role==='teacher'){const graded=data.submissions.filter(s=>s.grade!=null);return `<div class="grid">${card(`${heading('gradeSummary')}<div class="table-wrap"><table><tr><th>${tr('student')}</th><th>${tr('assignments')}</th><th>${tr('grade')}</th><th>${tr('feedback')}</th></tr>${graded.map(s=>`<tr><td>${esc(s.student)}</td><td>${esc(taskTitle(getTask(s.task)))}</td><td>${s.grade}/10</td><td>${esc(s.feedback)}</td></tr>`).join('')}</table></div>${graded.length?'':`<div class="empty">${tr('noSubmissions')}</div>`}${btn(tr('submissions'),"go('submissions')")}`)}</div>`}const mine=data.submissions.filter(s=>s.student==='Laurynas K.');return `<div class="grid">${card(`${heading('yourGrades')}<div class="table-wrap"><table><tr><th>${tr('assignments')}</th><th>${tr('grade')}</th><th>${tr('feedback')}</th></tr>${mine.map(s=>`<tr><td>${esc(taskTitle(getTask(s.task)))}</td><td>${s.grade==null?tr('notYetGraded'):s.grade+'/10'}</td><td>${esc(s.feedback||'—')}</td></tr>`).join('')}</table></div>${mine.length?'':`<div class="empty">${tr('noSubmissions')}</div>`}`)}</div>`}
// Show the teacher attendance checklist for the demonstration roster.
function attendanceView(){const key='1';return `<div class="grid">${card(`${heading('attendance')}<p class="muted">${tr('markAttendance')}</p><div class="toolbar"><span class="tag">PSIN</span><input type="date" id="att-date" style="width:auto" value="2026-11-10"></div>${students.map((s,i)=>`<label class="line" style="cursor:pointer"><span>${esc(s)}</span><input type="checkbox" id="att-${i}" ${data.attendance[key+'-'+i]!==false?'checked':''}></label>`).join('')}<p>${btn(tr('saveAttendance'),'saveAttendance()','sm')}</p>`,'s8')}</div>`}
// Save the attendance checkboxes to the backend.
async function saveAttendance(){
  const values={};students.forEach((s,i)=>values['1-'+i]=$('#att-'+i).checked);
  if(await sendAction('attendance',{values}))toast(tr('attendanceSaved'));
}
// Render Monday–Friday schedule cards and teacher-only edit controls.
function scheduleView(){
  const days=['mon','tue','wed','thu','fri'];
  const visible=(data.schedule||[]).filter(s=>accessibleCourses().some(c=>c.id===s.course));
  const ordered=visible.slice().sort((a,b)=>a.day-b.day||a.start.localeCompare(b.start));
  const editing=scheduleEditId!=null;
  const existing=editing&&scheduleEditId!=='new'?ordered.find(s=>s.id===scheduleEditId):null;
  const editForm=role==='teacher'&&editing?card(`${heading(existing?'editSession':'newSession')}
    <div class="schedule-form-grid">
      <div><label class="field" for="sch-course">${tr('selectCourse')}</label><select id="sch-course">${teacherCourses().map(c=>`<option value="${c.id}" ${existing?.course===c.id?'selected':''}>${esc(nameCourse(c))}</option>`).join('')}</select></div>
      <div><label class="field" for="sch-day">${tr('day')}</label><select id="sch-day">${days.map((d,i)=>`<option value="${i}" ${existing?.day===i?'selected':''}>${tr(d)}</option>`).join('')}</select></div>
      <div><label class="field" for="sch-start">${tr('startTime')}</label><input id="sch-start" type="time" value="${existing?.start||'08:30'}"></div>
      <div><label class="field" for="sch-end">${tr('endTime')}</label><input id="sch-end" type="time" value="${existing?.end||'10:00'}"></div>
      <div><label class="field" for="sch-room">${tr('sessionRoom')}</label><input id="sch-room" maxlength="50" value="${esc(existing?.room||'')}"></div>
    </div><div class="actions" style="margin-top:18px">${btn(tr('saveSession'),'saveSchedule()','sm')}${btn(tr('cancel'),'scheduleEditId=null;render()')}</div>`):'';
  return `<div class="schedule-header"><div><h2>${tr(role==='teacher'?'teacherSchedule':'studentSchedule')}</h2><p class="muted small">${tr(role==='teacher'?'scheduleShared':'scheduleReadOnly')}</p></div>${role==='teacher'?btn('+ '+tr('newSession'),"scheduleEditId='new';render()",'sm'):''}</div>
    ${editForm}
    <div class="schedule-days">${days.map((d,i)=>`<section class="schedule-day"><h3>${tr(d)}</h3><div class="schedule-slots">${ordered.filter(s=>s.day===i).map(s=>{
      const c=getCourse(s.course);const tint=({'PSIN':'#ed6a21','DB':'#b85324','ŽKS':'#158e83','MA':'#7d68bf','ANG':'#3469c6'})[c?.code]||'#ed6a21';
      return `<div class="schedule-slot" style="--course-accent:${tint}"><strong class="slot-time">${esc(s.start)}–${esc(s.end)}</strong><span class="tag">${esc(c?.code||'')}</span><div class="slot-title">${esc(c?nameCourse(c):'')}</div><div class="muted small">📍 ${esc(s.room)}</div>${role==='teacher'?`<div class="slot-actions">${btn(tr('editSchedule'),`scheduleEditId=${s.id};render()`,'secondary sm')}${btn(tr('deleteSession'),`deleteSchedule(${s.id})`,'outline sm')}</div>`:''}</div>`;
    }).join('')||`<div class="schedule-empty">${tr('emptyDay')}</div>`}</div></section>`).join('')}</div>`;
}
// Validate and save a newly added or edited class time.
async function saveSchedule(){
  if(role!=='teacher')return;
  const course=Number($('#sch-course')?.value),day=Number($('#sch-day')?.value),start=$('#sch-start')?.value||'',end=$('#sch-end')?.value||'',room=$('#sch-room')?.value.trim()||'';
  if(!start||!end||start>=end||!room)return toast(tr('scheduleError'));
  const payload={course,day,start,end,room};
  if(scheduleEditId!=='new')payload.id=scheduleEditId;
  if(await sendAction(scheduleEditId==='new'?'addSchedule':'updateSchedule',payload)){
    scheduleEditId=null;toast(tr('sessionSaved'));render();
  }
}
// Remove a class time after teacher confirmation.
async function deleteSchedule(id){
  if(role!=='teacher'||!confirm(tr('confirmSessionDelete')))return;
  if(await sendAction('removeSchedule',{id})){scheduleEditId=null;toast(tr('sessionDeleted'));render()}
}
// Main page renderer: sidebar, title and the currently selected view.
function render(){applyPrefs();const nav=role==='teacher'?teacherNav:studentNav;$('#nav').innerHTML=nav.map(([id,icon,key])=>`<button class="nav ${page===id||page==='courseInfo'&&id==='courses'?'active':''}" onclick="go('${id}')"><span class="ico">${icon}</span>${tr(key)}</button>`).join('');$('#page-title').textContent=tr(page==='dashboard'?(role==='teacher'?'teacherDash':'studentDash'):page==='courseInfo'?'courseInfo':page==='grading'&&role==='student'?'yourGrades':page);const view={dashboard,courses:coursesView,courseInfo,assignments:assignmentsView,materials:materialsView,submissions:submissionsView,grading:gradingView,attendance:attendanceView,schedule:scheduleView}[page];$('#content').innerHTML=view?view():dashboard()}
applyPrefs();
(async()=>{try{const r=await fetch('/api/health');if(!r.ok)throw Error();$('#server-status').textContent='● C++ backend online';}
catch(e){$('#server-status').textContent=lang==='lt'?'⚠ Paleiskite C++ serverį ir atidarykite http://127.0.0.1:8080':'⚠ Start the C++ server and open http://127.0.0.1:8080';}})();
</script></body></html>
